name: Check AGENTIA

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agentia-trigger"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compile Python
        run: |
          python3 -m py_compile agents/ollama_client.py
          python3 -m py_compile agents/prompts.py
          python3 -m py_compile agents/run_agent.py
          python3 -m py_compile agents/panel_review.py
          python3 -m py_compile agents/review.py
      - name: Validate topology
        run: |
          grep -F 'max-parallel: 20' .github/workflows/run-20-agents.yml
          grep -F 'max-parallel: 4' .github/workflows/run-20-agents.yml
          grep -F 'Panel Reviewer' .github/workflows/run-20-agents.yml
          grep -F 'build_agent_audit' agents/run_agent.py
          grep -F 'num_ctx=32768' agents/run_agent.py
          grep -F 'unique_source_lines_cited' agents/run_agent.py
          grep -F 'num_predict=4000' agents/review.py
