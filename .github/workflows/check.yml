name: Check AGENTIA

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agentia-trigger"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compile Python
        run: |
          python3 -m py_compile agents/ollama_client.py
          python3 -m py_compile agents/prompts.py
          python3 -m py_compile agents/run_agent.py
          python3 -m py_compile agents/panel_review.py
          python3 -m py_compile agents/review.py
          python3 -m py_compile agents/grounding_prompts.py
          python3 -m py_compile agents/fact_ledger.py
          python3 -m py_compile agents/semantic_gate.py
          python3 -m unittest tests/test_grounding.py
      - name: Validate local-only topology
        run: |
          grep -F 'max-parallel: 20' .github/workflows/run-20-agents.yml
          grep -F 'max-parallel: 4' .github/workflows/run-20-agents.yml
          grep -F 'Panel Reviewer' .github/workflows/run-20-agents.yml
          grep -F 'build_agent_audit' agents/run_agent.py
          grep -F 'num_ctx=32768' agents/run_agent.py
          grep -F 'num_ctx=32768' agents/panel_review.py
          grep -F 'num_predict=4000' agents/review.py
          grep -F 'Build Verified Fact Ledger' .github/workflows/run-20-agents.yml
          grep -F -- '--ledger fact-ledger/fact-ledger.json' .github/workflows/run-20-agents.yml
          grep -F 'TARGET_SUPPORT_RATIO = 0.95' agents/semantic_gate.py
          grep -F 'verifier_a' agents/semantic_gate.py
          grep -F 'verifier_b' agents/semantic_gate.py
          grep -F 'claim_coverage_check' agents/semantic_gate.py
          grep -F 'run_atomic_semantic_gate' agents/review.py
          grep -F 'http://127.0.0.1:11434/api/chat' agents/ollama_client.py
          if grep -R -E 'OLLAMA_API_KEY|qwen3\.5:cloud|ollama\.com/api' agents .github/workflows/run-20-agents.yml .github/actions; then
            echo "External/cloud Ollama configuration is forbidden"
            exit 1
          fi
